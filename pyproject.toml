[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spoofguard"
version = "0.1.0"
description = "A zero-dependency, honest-by-construction email spoofing (SPF/DMARC/DKIM) posture scanner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyle Deligny" }]
keywords = [
    "dmarc", "spf", "dkim", "dnssec", "mta-sts",
    "email-security", "dns", "phishing", "bec", "invoice-fraud",
    "security-scanner", "email-spoofing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Communications :: Email",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kyle4814/spoofguard"
Issues = "https://github.com/kyle4814/spoofguard/issues"
Source = "https://github.com/kyle4814/spoofguard"

[project.scripts]
spoofguard = "spoofguard.cli:main"

[tool.setuptools.packages.find]
include = ["spoofguard*"]

[tool.setuptools.package-data]
spoofguard = ["py.typed"]
